<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ARTHAGRID Financial Services</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-page);
        }
        .error-card {
            background: #FFFFFF;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 50px 40px;
            max-width: 540px;
            box-shadow: var(--shadow-card-hover);
        }
        .error-code {
            font-size: 5.5rem;
            font-weight: 900;
            color: var(--brand-navy);
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.5rem;
            color: var(--brand-navy);
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="error-page-container">
        <div class="error-card">
            <div style="margin-bottom: 20px;">
                <img src="logo.png" alt="ARTHAGRID" style="height: 60px; margin: 0 auto; display: block;">
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
                The page or financial resource you are looking for does not exist or may have been moved. Return to our homepage to explore loan solutions and calculate your EMI.
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-home"></i> Back to Homepage
                </a>
                <a href="/#contact" class="btn btn-secondary">
                    <i class="fas fa-headset"></i> Contact Advisory
                </a>
            </div>
        </div>
    </div>
</body>

</html>
